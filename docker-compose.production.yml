# =============================================================================
# AEMS — Docker Compose PRODUCTION (Sprint 11)
# Chạy: docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
# =============================================================================

name: aems-production

services:
  postgres:
    image: postgres:16-alpine
    container_name: aems-postgres
    restart: always
    env_file: .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./data/backups/db:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aems-internal
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: aems-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aems-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    image: aems-backend:${AEMS_VERSION:-11.0.0}
    container_name: aems-backend
    restart: always
    env_file: .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      LOG_DIR: /app/logs
      PERFORMANCE_CONFIG_PATH: /config/performance.yaml
      AEMS_REALTIME_DEMO: "false"
    volumes:
      - ./logs:/app/logs
      - ./data/evidence:/app/data/evidence
      - ./data/backups:/app/data/backups
      - ./config:/config:ro
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - aems-internal
    deploy:
      resources:
        limits:
          memory: 4G

  ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    image: aems-backend:${AEMS_VERSION:-11.0.0}
    container_name: aems-ai-worker
    restart: always
    command: ["python", "-m", "app.modules.ops.ai_worker"]
    env_file: .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      LOG_DIR: /app/logs
      PERFORMANCE_CONFIG_PATH: /config/performance.yaml
      AEMS_REALTIME_DEMO: "false"
    volumes:
      - ./logs:/app/logs
      - ./data/evidence:/app/data/evidence
      - ./config:/config:ro
      - ./models:/models:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aems-internal
    deploy:
      resources:
        limits:
          memory: 8G
          # Uncomment for NVIDIA GPU:
          # reservations:
          #   devices:
          #     - driver: nvidia
          #       count: 1
          #       capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_WS_URL: wss://${DOMAIN:-localhost}/api/v1/ws
    image: aems-frontend:${AEMS_VERSION:-11.0.0}
    container_name: aems-frontend
    restart: always
    networks:
      - aems-internal

  nginx:
    image: nginx:1.27-alpine
    container_name: aems-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/docker/nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/docker/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - aems-internal
      - aems-public

  watchdog:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    image: aems-backend:${AEMS_VERSION:-11.0.0}
    container_name: aems-watchdog
    restart: always
    command: ["python", "-m", "app.modules.ops.watchdog"]
    env_file: .env.production
    environment:
      WATCHDOG_BACKEND_URL: http://backend:8000
      WATCHDOG_INTERVAL_S: "30"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aems-internal

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aems-prometheus
    restart: always
    volumes:
      - ./deploy/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - aems-internal

  grafana:
    image: grafana/grafana:11.2.0
    container_name: aems-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - aems-internal

  # Optional: Let's Encrypt renewal (uncomment for production with real domain)
  # certbot:
  #   image: certbot/certbot:latest
  #   volumes:
  #     - ./deploy/ssl:/etc/letsencrypt
  #     - certbot-webroot:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  backup:
    image: postgres:16-alpine
    container_name: aems-backup
    restart: always
    env_file: .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          TS=$$(date +%Y%m%d_%H%M%S)
          pg_dump -h postgres -U "$$POSTGRES_USER" "$$POSTGRES_DB" > "/backups/database_$${TS}.sql"
          find /backups -name 'database_*.sql' -mtime +7 -delete
          sleep 86400
        done
    volumes:
      - ./data/backups/db:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aems-internal
    profiles:
      - backup-cron

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
  certbot-webroot:
  # backup-scripts: removed — backup uses postgres image

networks:
  aems-internal:
    driver: bridge
    internal: false
  aems-public:
    driver: bridge
