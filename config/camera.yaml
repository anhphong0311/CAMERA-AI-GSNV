# =============================================================================
# AEMS Camera Service — cấu hình stream RTSP (Sprint 2)
# Mount read-only vào container: ./config/camera.yaml
# =============================================================================

# Thời gian chờ giữa các lần reconnect (giây) — exponential backoff
# Khi mất mạng/switch, nhiều camera sẽ cùng reconnect. Backoff dài hơn giữ
# CPU và API responsive thay vì 6 luồng đồng thời tạo kết nối RTSP liên tục.
reconnect_delays: [5, 15, 30, 60, 120]

# Preview/dashboard chỉ cần frame mới nhất; evidence dùng buffer riêng.
# Giữ 2 frame gốc mỗi camera để tránh chiếm nhiều GB RAM khi chạy nhiều luồng 1080p.
queue_size: 2

# FPS mục tiêu khi đọc stream (sleep giữa các frame nếu đọc quá nhanh)
target_fps: 2

# Buffer frame gốc của worker; health/FPS không cần giữ lịch sử ảnh.
buffer_size: 2

# Resize frame khi đọc (0 = giữ nguyên kích thước gốc)
frame_width: 0
frame_height: 0

# Timeout kết nối / đọc RTSP (giây)
timeout_seconds: 10

# Tự khởi động worker cho camera enabled=true khi app startup
auto_start_enabled: true

# Chu kỳ ghi heartbeat vào DB (giây)
heartbeat_interval_seconds: 5

# Cảnh báo Telegram cho camera enabled khi mất kết nối, không có worker,
# hoặc không có frame mới. Gửi một lần sau thời gian chờ và báo khi phục hồi.
telegram_alerts_enabled: true
alert_check_interval_seconds: 5
alert_grace_seconds: 30
alert_startup_grace_seconds: 180
alert_stale_frame_seconds: 30

# Preview live view (GET /cameras/{id}/frame) — giảm lag dashboard
preview_jpeg_quality: 50
preview_max_width: 640
