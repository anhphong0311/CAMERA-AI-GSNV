name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full test suite
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q

      - name: Build production Docker images
        run: |
          docker build -f backend/Dockerfile.production -t aems-backend:${{ steps.ver.outputs.version }} backend
          docker build -f frontend/Dockerfile.production \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            --build-arg VITE_WS_URL=wss://localhost/api/v1/ws \
            -t aems-frontend:${{ steps.ver.outputs.version }} frontend

      - name: Generate release notes
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            git log ${PREV}..HEAD --pretty=format:"- %s" > RELEASE_NOTES.md
          else
            echo "- Initial release ${{ steps.ver.outputs.version }}" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AEMS v${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

      - name: Push release images
        if: ${{ secrets.REGISTRY_USERNAME != '' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REGISTRY: ${{ secrets.REGISTRY_USERNAME }}
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "$REGISTRY" --password-stdin
          docker tag aems-backend:$VERSION $REGISTRY/aems-backend:$VERSION
          docker tag aems-frontend:$VERSION $REGISTRY/aems-frontend:$VERSION
          docker push $REGISTRY/aems-backend:$VERSION
          docker push $REGISTRY/aems-frontend:$VERSION
