name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-test:
    name: Backend - Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check (compileall)
        working-directory: backend
        run: python -m compileall -q app

      - name: Ruff lint
        working-directory: backend
        run: ruff check app tests

      - name: Bandit security scan
        working-directory: backend
        run: bandit -r app -c pyproject.toml -ll

      - name: Run tests with coverage (>=90%)
        working-directory: backend
        run: python -m pytest --cov=app --cov-config=.coveragerc --cov-report=term -q

  frontend-build:
    name: Frontend - Lint, Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Unit test
        working-directory: frontend
        run: npm run test --if-present

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image (dev)
        run: docker build -f backend/Dockerfile -t aems-backend:ci backend

      - name: Build frontend image (dev)
        run: docker build -f frontend/Dockerfile -t aems-frontend:ci frontend

      - name: Build production images
        run: |
          docker build -f backend/Dockerfile.production -t aems-backend:prod-ci backend
          docker build -f frontend/Dockerfile.production \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            --build-arg VITE_WS_URL=wss://localhost/api/v1/ws \
            -t aems-frontend:prod-ci frontend

      - name: Validate production compose
        run: |
          cp .env.production.example .env.production
          docker compose -f docker-compose.production.yml config --quiet

  # Đẩy image chỉ khi push lên main và có cấu hình registry secret (tùy chọn).
  docker-push:
    name: Docker Push (main)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to registry
        if: ${{ secrets.REGISTRY_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push backend
        if: ${{ secrets.REGISTRY_USERNAME != '' }}
        run: |
          docker build -f backend/Dockerfile -t ${{ secrets.REGISTRY_USERNAME }}/aems-backend:latest backend
          docker push ${{ secrets.REGISTRY_USERNAME }}/aems-backend:latest
